<form action="/login" method="post" id="login-form">
    <h2>Log in to your account</h2>
    <ul style="list-style-type: none; padding-left: 0;">
        <li style="padding-bottom:1%;">
            <input type="text" id="user-name" name="usernameentry" placeholder="User name"/>
        </li>
        <li>
            <input type="text" id="pass-word" name="passentry" placeholder="Password"/>
        </li>
    </ul>
    <div class="button">
        <button type="submit">Log in</button>
    </div>
</form>
<p>No account yet ?<strong><a href="/register"> Sign Up</a></strong></p>

<script>
    document.getElementById('login-form').addEventListener('submit', async function(event) {
        event.preventDefault(); 
        
        const form = event.target;
        const formData = new FormData(form);
        const response = await fetch('/login', {
            method: 'POST',
            body: formData, 
        });

        const result = await response.json();

        if (response.ok) {
            // Login successful, save the token and redirect
            localStorage.setItem('access_token', result.access_token);
            window.location.href = '/profile'; 
        } else {
            alert(result.message);
        }
    });
</script>
